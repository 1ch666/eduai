worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        # Same entry path as the website, while keeping legacy localhost:8080/.
        # Relative Build/* URLs work from both roots. Internal rewrite only.
        location = /play { return 302 /play/; }
        location /play/ { rewrite ^/play/(.*)$ /$1 last; }
        # Backend staff replace this block with a same-origin proxy.
        # Never claim the prototype has working authentication or AI.
        location /api/ {
            default_type application/json;
            return 501 '{"error":"backend_not_configured"}';
        }
        location / { try_files $uri $uri/ =404; }
    }
}
