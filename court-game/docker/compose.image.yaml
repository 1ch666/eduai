# For the downloaded image bundle; no repository or Unity Editor is required.
services:
  court:
    image: eduai-court:preview
    pull_policy: never
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
